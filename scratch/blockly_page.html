<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eLabOrchestra Block Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1A1A2A; }
  #blocklyDiv { width: 100%; height: 100%; }

  /* Blockly theme overrides */
  .blocklyToolboxDiv { background: #252535 !important; border-right: 1px solid #333360 !important; }
  .blocklyTreeLabel { color: #CCC !important; font-family: 'Segoe UI', sans-serif !important; font-size: 11px !important; }
  .blocklyTreeRow:hover .blocklyTreeLabel { color: #fff !important; }
  .blocklyTreeSelected .blocklyTreeLabel { color: #fff !important; }
  .blocklyFlyout { background: #1E1E30 !important; }
  .blocklyScrollbarHandle { fill: #4C97FF !important; }
  .blocklyMainBackground { fill: #1A1A2A !important; }

  /* Status bar */
  #statusBar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 24px; background: #0F0F1A;
    border-top: 1px solid #333355;
    color: #8888AA; font: 11px 'Segoe UI', sans-serif;
    display: flex; align-items: center; padding: 0 10px; gap: 16px;
    z-index: 1000;
  }
  #statusBar span { color: #CCC; }
</style>
</head>
<body>

<div id="blocklyDiv"></div>

<div id="statusBar">
  Blocks: <span id="blockCount">0</span>
  &nbsp;|&nbsp;
  Status: <span id="runStatus">Idle</span>
  &nbsp;|&nbsp;
  <span id="lastMsg"></span>
</div>

<!-- Blockly pinned to 10.4.3 — stable: has Xml API, inputTypes, no FocusManager bug -->
<script src="https://unpkg.com/blockly@10.4.3/blockly_compressed.js"></script>
<script src="https://unpkg.com/blockly@10.4.3/blocks_compressed.js"></script>
<script src="https://unpkg.com/blockly@10.4.3/msg/en.js"></script>
<!-- Qt WebChannel JS bridge -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script>
// ── Custom colour palette ─────────────────────────────────────────────────
const COLOUR = {
  EVENTS:      '#FFAB19',
  INSTRUMENT:  '#4C97FF',
  MEASUREMENT: '#5CB1D6',
  CONTROL:     '#FF8C1A',
  LOGGING:     '#9966FF',
  PSU:         '#43A047',   // power supply — green
  LMG:         '#9C27B0',   // LMG450 power analyser — violet
  DASH:        '#E64A19',   // Dashboard — deep orange
  DSP:         '#00838F',   // Magtrol DSP7000 — teal
};

// ── Custom block definitions ──────────────────────────────────────────────

// ─ Events ─
Blockly.defineBlocksWithJsonArray([
{
  "type": "lcr_when_start",
  "message0": "▶ when started",
  "nextStatement": null,
  "colour": COLOUR.EVENTS,
  "tooltip": "Runs the stack below when the program starts.",
  "hat": "cap"
},
{
  "type": "lcr_when_timer",
  "message0": "every %1 s",
  "args0": [{ "type": "field_number", "name": "INTERVAL", "value": 1, "min": 0.1, "precision": 0.1 }],
  "nextStatement": null,
  "colour": COLOUR.EVENTS,
  "tooltip": "Repeats the stack below on a fixed interval.",
  "hat": "cap"
},
// ─ Instrument ─
{
  "type": "lcr_set_mode",
  "message0": "set mode %1",
  "args0": [{ "type": "field_dropdown", "name": "MODE",
    "options": [["Cs","Cs"],["Cp","Cp"],["Ls","Ls"],["Lp","Lp"],
                ["Rs","Rs"],["Rp","Rp"],["Z","Z"],["D","D"],
                ["Q","Q"],["θ (Phase)","Theta"],["ESR","ESR"],["DCR","DCR"]] }],
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.INSTRUMENT,
  "tooltip": "Set the measurement mode."
},
{
  "type": "lcr_set_frequency",
  "message0": "set frequency %1",
  "args0": [{ "type": "field_dropdown", "name": "FREQ",
    "options": [["100 Hz","F100Hz"],["120 Hz","F120Hz"],["1 kHz","F1kHz"],
                ["10 kHz","F10kHz"],["100 kHz","F100kHz"]] }],
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.INSTRUMENT,
  "tooltip": "Set the test frequency."
},
{
  "type": "lcr_hold",
  "message0": "hold %1",
  "args0": [{ "type": "field_dropdown", "name": "STATE",
    "options": [["ON","true"],["OFF","false"]] }],
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.INSTRUMENT,
  "tooltip": "Freeze (hold) the current reading."
},
{
  "type": "lcr_rel",
  "message0": "REL %1",
  "args0": [{ "type": "field_dropdown", "name": "STATE",
    "options": [["ON","true"],["OFF","false"]] }],
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.INSTRUMENT,
  "tooltip": "Enable/disable relative measurement mode."
},
{
  "type": "lcr_beep",
  "message0": "beep",
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.INSTRUMENT,
  "tooltip": "Trigger a beep on the device."
},
// ─ Measurement reporters ─
{
  "type": "lcr_read_primary",
  "message0": "primary value",
  "output": "Number",
  "colour": COLOUR.MEASUREMENT,
  "tooltip": "Returns the current primary measurement value."
},
{
  "type": "lcr_read_secondary",
  "message0": "secondary value",
  "output": "Number",
  "colour": COLOUR.MEASUREMENT,
  "tooltip": "Returns the current secondary measurement value."
},
{
  "type": "lcr_read_phase",
  "message0": "phase angle °",
  "output": "Number",
  "colour": COLOUR.MEASUREMENT,
  "tooltip": "Returns the phase angle in degrees."
},
{
  "type": "lcr_read_mode",
  "message0": "current mode",
  "output": "String",
  "colour": COLOUR.MEASUREMENT,
  "tooltip": "Returns the active measurement mode as a string."
},
{
  "type": "lcr_read_freq",
  "message0": "test frequency",
  "output": "String",
  "colour": COLOUR.MEASUREMENT,
  "tooltip": "Returns the current test frequency label."
},
{
  "type": "lcr_is_overload",
  "message0": "overload?",
  "output": "Boolean",
  "colour": COLOUR.MEASUREMENT,
  "tooltip": "True if the meter is showing an overload."
},
// ─ Logging ─
{
  "type": "lcr_log_measurement",
  "message0": "log measurement to CSV",
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.LOGGING,
  "tooltip": "Log all measurement values to the active CSV file."
},
{
  "type": "lcr_log_value",
  "message0": "log %1 = %2",
  "args0": [
    { "type": "field_input", "name": "LABEL", "text": "value" },
    { "type": "input_value", "name": "VALUE", "check": ["Number","String"] }
  ],
  "inputsInline": true,
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.LOGGING,
  "tooltip": "Log a labelled value to the active CSV file."
},
{
  "type": "lcr_show_value",
  "message0": "show %1 = %2",
  "args0": [
    { "type": "field_input", "name": "LABEL", "text": "value" },
    { "type": "input_value", "name": "VALUE", "check": ["Number","String"] }
  ],
  "inputsInline": true,
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.LOGGING,
  "tooltip": "Display a labelled value in the status bar."
},
{
  "type": "lcr_start_log",
  "message0": "start CSV log %1",
  "args0": [{ "type": "field_input", "name": "FILE", "text": "log.csv" }],
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.LOGGING,
  "tooltip": "Open a CSV file for logging."
},
{
  "type": "lcr_stop_log",
  "message0": "stop CSV log",
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.LOGGING,
  "tooltip": "Close the active CSV log file."
},
]);

// ── Power Supply blocks (OWON SP3103) ─────────────────────────────────────
Blockly.defineBlocksWithJsonArray([
{
  "type": "psu_set_voltage",
  "message0": "PSU set voltage %1",
  "args0": [{ "type": "input_value", "name": "VOLTAGE", "check": "Number" }],
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.PSU,
  "tooltip": "Set the power supply output voltage (0 – 30 V)."
},
{
  "type": "psu_set_current",
  "message0": "PSU set current limit %1",
  "args0": [{ "type": "input_value", "name": "CURRENT", "check": "Number" }],
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.PSU,
  "tooltip": "Set the power supply current limit (0 – 3 A)."
},
{
  "type": "psu_output",
  "message0": "PSU output %1",
  "args0": [{ "type": "field_dropdown", "name": "STATE",
    "options": [["ON","ON"],["OFF","OFF"]] }],
  "previousStatement": null,
  "nextStatement": null,
  "colour": COLOUR.PSU,
  "tooltip": "Enable or disable the power supply output."
},
{
  "type": "psu_read_voltage",
  "message0": "PSU voltage",
  "output": "Number",
  "colour": COLOUR.PSU,
  "tooltip": "Read the measured output voltage in volts."
},
{
  "type": "psu_read_current",
  "message0": "PSU current",
  "output": "Number",
  "colour": COLOUR.PSU,
  "tooltip": "Read the measured output current in amps."
},
{
  "type": "psu_read_power",
  "message0": "PSU power",
  "output": "Number",
  "colour": COLOUR.PSU,
  "tooltip": "Read the measured output power in watts (V × I)."
},
{
  "type": "psu_is_output_on",
  "message0": "PSU output is ON?",
  "output": "Boolean",
  "colour": COLOUR.PSU,
  "tooltip": "True when the power supply output is enabled."
},
]);

// ── LMG450 Power Analyser blocks ─────────────────────────────────────────────
Blockly.defineBlocksWithJsonArray([

// ─ Commands ─
{
  "type": "lmg_select_channel",
  "message0": "LMG select channel %1",
  "args0": [{ "type": "field_dropdown", "name": "CHANNEL",
    "options": [["1","1"],["2","2"],["3","3"],["4","4"]] }],
  "previousStatement": null, "nextStatement": null,
  "colour": COLOUR.LMG,
  "tooltip": "Set the active measurement channel (1–4)."
},
{
  "type": "lmg_set_averaging",
  "message0": "LMG averaging %1",
  "args0": [{ "type": "input_value", "name": "COUNT", "check": "Number" }],
  "previousStatement": null, "nextStatement": null,
  "colour": COLOUR.LMG,
  "tooltip": "Set number of cycles to average (1–128)."
},
{
  "type": "lmg_integration_start",
  "message0": "LMG integration start",
  "previousStatement": null, "nextStatement": null,
  "colour": COLOUR.LMG,
  "tooltip": "Start the energy / charge integration timer."
},
{
  "type": "lmg_integration_stop",
  "message0": "LMG integration stop",
  "previousStatement": null, "nextStatement": null,
  "colour": COLOUR.LMG,
  "tooltip": "Pause the energy / charge integration timer."
},
{
  "type": "lmg_integration_reset",
  "message0": "LMG integration reset",
  "previousStatement": null, "nextStatement": null,
  "colour": COLOUR.LMG,
  "tooltip": "Reset energy and charge accumulators to zero."
},

// ─ Single-channel reporters ─
{
  "type": "lmg_read_voltage",
  "message0": "LMG voltage (Vrms)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "True-RMS voltage of the active channel (V)."
},
{
  "type": "lmg_read_current",
  "message0": "LMG current (Arms)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "True-RMS current of the active channel (A)."
},
{
  "type": "lmg_read_power",
  "message0": "LMG active power (W)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Active power P of the active channel (W)."
},
{
  "type": "lmg_read_reactive",
  "message0": "LMG reactive power (VAr)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Reactive power Q of the active channel (VAr)."
},
{
  "type": "lmg_read_apparent",
  "message0": "LMG apparent power (VA)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Apparent power S of the active channel (VA)."
},
{
  "type": "lmg_read_pf",
  "message0": "LMG power factor λ",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Power factor λ = P/S of the active channel (−1…+1)."
},
{
  "type": "lmg_read_phase",
  "message0": "LMG phase angle φ (°)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Phase angle between voltage and current (degrees)."
},
{
  "type": "lmg_read_frequency",
  "message0": "LMG frequency (Hz)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Voltage frequency of the active channel (Hz)."
},
{
  "type": "lmg_read_energy",
  "message0": "LMG energy (Wh)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Accumulated energy of the active channel (Wh)."
},
{
  "type": "lmg_read_charge",
  "message0": "LMG charge (Ah)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Accumulated charge of the active channel (Ah)."
},
{
  "type": "lmg_read_thd_v",
  "message0": "LMG voltage THD (%)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Total harmonic distortion of voltage (%)."
},
{
  "type": "lmg_read_thd_i",
  "message0": "LMG current THD (%)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Total harmonic distortion of current (%)."
},
{
  "type": "lmg_read_harmonic_v",
  "message0": "LMG voltage harmonic order %1",
  "args0": [{ "type": "input_value", "name": "ORDER", "check": "Number" }],
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Amplitude of the nth voltage harmonic (V)."
},
{
  "type": "lmg_read_harmonic_i",
  "message0": "LMG current harmonic order %1",
  "args0": [{ "type": "input_value", "name": "ORDER", "check": "Number" }],
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Amplitude of the nth current harmonic (A)."
},

// ─ Aggregate reporters ─
{
  "type": "lmg_read_psum",
  "message0": "LMG total active power ∑P (W)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Sum of active powers across all channels (W)."
},
{
  "type": "lmg_read_qsum",
  "message0": "LMG total reactive power ∑Q (VAr)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Sum of reactive powers across all channels (VAr)."
},
{
  "type": "lmg_read_ssum",
  "message0": "LMG total apparent power ∑S (VA)",
  "output": "Number", "colour": COLOUR.LMG,
  "tooltip": "Sum of apparent powers across all channels (VA)."
},
]);

// ── Toolbox XML ───────────────────────────────────────────────────────────
const TOOLBOX = {
  kind: "categoryToolbox",
  contents: [
    {
      kind: "category", name: "Events", colour: COLOUR.EVENTS,
      contents: [
        { kind: "block", type: "lcr_when_start" },
        { kind: "block", type: "lcr_when_timer" },  // INTERVAL is a field_number, no shadow needed
      ]
    },
    {
      kind: "category", name: "Hantek LCR 1833C", colour: COLOUR.INSTRUMENT,
      contents: [
        { kind: "block", type: "lcr_set_mode" },
        { kind: "block", type: "lcr_set_frequency" },
        { kind: "block", type: "lcr_hold" },
        { kind: "block", type: "lcr_rel" },
        { kind: "block", type: "lcr_beep" },
        { kind: "sep" },
        { kind: "block", type: "lcr_read_primary" },
        { kind: "block", type: "lcr_read_secondary" },
        { kind: "block", type: "lcr_read_phase" },
        { kind: "block", type: "lcr_read_mode" },
        { kind: "block", type: "lcr_read_freq" },
        { kind: "block", type: "lcr_is_overload" },

    {

        { kind: "block", type: "psu_set_current",
          inputs: { CURRENT: { shadow: { type: "math_number", fields: { NUM: 0.5 } } } } },
        { kind: "block", type: "psu_read_voltage" },
        { kind: "block", type: "psu_read_current" },
        { kind: "block", type: "psu_read_power" },
        { kind: "block", type: "psu_is_output_on" },

    {

        { kind: "block", type: "lmg_read_power"     },
        { kind: "block", type: "lmg_read_reactive"  },
        { kind: "block", type: "lmg_read_apparent"  },
        { kind: "block", type: "lmg_read_pf"        },
        { kind: "block", type: "lmg_read_phase"     },
        { kind: "block", type: "lmg_read_frequency" },

        { kind: "block", type: "lmg_read_charge"    },
        { kind: "block", type: "lmg_read_thd_v"     },
        { kind: "block", type: "lmg_read_thd_i"     },
        { kind: "block", type: "lmg_read_harmonic_v",
          inputs: { ORDER: { shadow: { type: "math_number", fields: { NUM: 1 } } } } },
        { kind: "block", type: "lmg_read_harmonic_i",
          inputs: { ORDER: { shadow: { type: "math_number", fields: { NUM: 1 } } } } },
        // ─ aggregate reporters ─

        { kind: "block", type: "lmg_read_qsum" },

    {

      contents: [

          inputs: { RATE: { shadow: { type: "math_number", fields: { NUM: 100 } } } } },

        { kind: "block", type: "dash_dropdown_value" },
        // ─ slider ─
        { kind: "block", type: "dash_config_slider",
          inputs: {
            MIN:  { shadow: { type: "math_number", fields: { NUM: 0   } } },
            MAX:  { shadow: { type: "math_number", fields: { NUM: 100 } } },

        { kind: "block", type: "dash_set_slider",

  base: Blockly.Themes.Classic,
  componentStyles: {
    workspaceBackgroundColour: '#1A1A2A',
    toolboxBackgroundColour:   '#252535',
    toolboxForegroundColour:   '#CCCCDD',
    flyoutBackgroundColour:    '#1E1E30',
    flyoutForegroundColour:    '#CCCCDD',
    flyoutOpacity: 1,
    scrollbarColour: '#4C97FF',
    insertionMarkerColour: '#ffffff',
    insertionMarkerOpacity: 0.3,
    scrollbarOpacity: 0.6,
    cursorColour: '#d0d0ff',
  },
  fontStyle: { family: "'Segoe UI', Arial, sans-serif", size: 11 },
  blockStyles: {
    hat_blocks:         { colourPrimary: COLOUR.EVENTS },
    logic_blocks:       { colourPrimary: '#59C059' },
    loop_blocks:        { colourPrimary: '#FF8C1A' },
    math_blocks:        { colourPrimary: '#59C059' },
    text_blocks:        { colourPrimary: '#5C81A6' },
    variable_blocks:    { colourPrimary: '#FF6680' },
    variable_dynamic_blocks: { colourPrimary: '#FF6680' },
    procedure_blocks:   { colourPrimary: '#AA55CC' },
  }
});

// ── Workspace init ────────────────────────────────────────────────────────
const workspace = Blockly.inject('blocklyDiv', {
  toolbox: TOOLBOX,
  theme: darkTheme,
  grid: { spacing: 20, length: 3, colour: '#252540', snap: true },
  zoom: { controls: true, wheel: true, startScale: 1.0, maxScale: 3, minScale: 0.3 },
  trashcan: true,
  move: { scrollbars: true, drag: true, wheel: false },
  sounds: false,
});

// Fix height to leave room for status bar
function resize() {
  document.getElementById('blocklyDiv').style.height =
    (window.innerHeight - 24) + 'px';
  Blockly.svgResize(workspace);
}
window.addEventListener('resize', resize);
resize();

// ── Python bridge via QWebChannel ────────────────────────────────────────
let bridge = null;

new QWebChannel(qt.webChannelTransport, function(channel) {
  bridge = channel.objects.bridge;

  // Restore saved workspace if available.
  // Bridge stores XML (Blockly.Xml still works in v10); use domToWorkspace, not textToDom.
  bridge.get_workspace(function(xml) {
    if (xml && xml.trim()) {
      try {
        const parser = new DOMParser();
        const dom = parser.parseFromString(xml, 'text/xml').firstChild;
        Blockly.Xml.domToWorkspace(dom, workspace);
      } catch(e) {
        console.warn('Could not restore workspace:', e);
      }
    }
  });

  // Forward run/stop status updates from Python
  bridge.statusChanged.connect(function(msg) {
    document.getElementById('runStatus').textContent = msg;
  });

  bridge.messageChanged.connect(function(msg) {
    document.getElementById('lastMsg').textContent = msg;
  });
});

// Send workspace to Python whenever it changes
workspace.addChangeListener(function(event) {
  if (event.isUiEvent) return;
  const xml = Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(workspace));
  const json = JSON.stringify(workspaceToJson());
  document.getElementById('blockCount').textContent = workspace.getAllBlocks(false).length;
  if (bridge) {
    bridge.on_workspace_change(xml, json);
  }
});

// Convert workspace to a simple JSON structure Python can execute
function workspaceToJson() {
  const topBlocks = workspace.getTopBlocks(true);
  return { stacks: topBlocks.map(blockToObj) };
}

function blockToObj(block) {
  if (!block) return null;
  const obj = {
    type: block.type,
    id:   block.id,
    fields: {},
    inputs: {},
    next: null,
  };
  // fields
  block.inputList.forEach(input => {
    input.fieldRow.forEach(field => {
      if (field.name) obj.fields[field.name] = field.getValue();
    });
  });
  // value inputs (reporters plugged in)
  block.inputList.forEach(input => {
    // Blockly v10: Blockly.inputTypes.VALUE === 1, STATEMENT === 3
    if (input.type === Blockly.inputTypes.VALUE && input.connection && input.connection.targetBlock()) {
      obj.inputs[input.name] = blockToObj(input.connection.targetBlock());
    }
    if (input.type === Blockly.inputTypes.STATEMENT && input.connection && input.connection.targetBlock()) {
      obj.inputs[input.name + '_BODY'] = blockToObj(input.connection.targetBlock());
    }
  });
  // next
  if (block.nextConnection && block.nextConnection.targetBlock()) {
    obj.next = blockToObj(block.nextConnection.targetBlock());
  }
  return obj;
}

// ── Python-callable functions (invoked via bridge slots) ─────────────────
function clearWorkspace() {
  workspace.clear();
}

function loadXml(xml) {
  workspace.clear();
  try {
    const dom = Blockly.Xml.textToDom(xml);
    Blockly.Xml.domToWorkspace(dom, workspace);
  } catch(e) {
    console.error('loadXml error:', e);
  }
}

function getXml() {
  return Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(workspace));
}

function setRunStatus(msg) {
  document.getElementById('runStatus').textContent = msg;
}
</script>
